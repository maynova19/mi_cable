name: Actualizar lista

on:
  schedule:
    - cron: "17 9 * * *"   # todos los días a las 04:17 hora de Perú
  workflow_dispatch:        # botón para ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar lista
        run: python generar_lista.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Actualizar lista $(date -u +%F)"
          git push